name: CI/CD – Hostinger

# build      → every push & pull request: install, build + prerender, verify output
# deploy     → only pushes to main (or manual run): upload the verified build to Hostinger via FTP
# smoke-test → after deploy: checks the live site (status codes, redirects, SEO tags)

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and prerender
        run: npm run build
        env:
          # Optional: set a repository variable VITE_GA4_ID (Settings → Secrets and variables → Actions → Variables)
          VITE_GA4_ID: ${{ vars.VITE_GA4_ID }}

      - name: Verify build output
        run: node scripts/check-dist.mjs dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true # keep .htaccess
          retention-days: 7

  deploy:
    name: Deploy to Hostinger
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://ecopakservices.com
    concurrency:
      group: hostinger-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./ # Hostinger FTP account root = public_html
          # Only changed files are uploaded (tracked in .ftp-deploy-sync-state.json on the server).
          # Files removed from the build are NOT deleted on the server.

  smoke-test:
    name: Smoke test live site
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - name: Wait for propagation
        run: sleep 20
      - name: Check live URLs
        run: bash scripts/smoke-test.sh https://ecopakservices.com
