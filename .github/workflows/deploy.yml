name: Deploy to Hostinger

on:
  push:
    branches:
      - main # Change to 'master' if that is your default branch name

jobs:
  build-and-deploy:
    name: Build and Deploy React App
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the code from GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup the Node.js environment to run npm commands
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Uses a stable version of Node.js

      # 3. Install the project dependencies (like running npm install locally)
      - name: Install Dependencies
        run: npm install

      # 4. Build the Vite project to generate the "dist" folder
      - name: Build Project
        run: npm run build

      # 5. Connect to Hostinger and upload the "dist" folder automatically
      - name: Upload to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/ # The folder generated by the build step
          server-dir: ./public_html/ # Change this if your Hostinger folder is named differently
